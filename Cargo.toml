[package]
name = "vit_tch"
version = "0.1.0"
edition = "2024"
description = "Vision Transformer models and building blocks for Rust using tch."
license = "MIT"
repository = "https://github.com/iBz-04/vit.rs"
homepage = "https://github.com/iBz-04/vit.rs"
documentation = "https://docs.rs/vit_tch"
readme = "README.md"
keywords = ["vision", "transformer", "vit", "tch", "pytorch"]
categories = ["science"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/scripts/**",
    "/images/**",
]

[features]
default = ["doc-only"]
doc-only = ["tch/doc-only"]
target-checks = []
runtime = ["target-checks"]
download-libtorch = ["runtime", "tch/download-libtorch"]

[lib]
test = false
doctest = false

[[test]]
name = "vit_shapes"
path = "tests/vit_shapes.rs"
required-features = ["target-checks"]

[[example]]
name = "vit_inference"
path = "examples/vit_inference.rs"
required-features = ["target-checks"]
test = false

[[example]]
name = "cct_inference"
path = "examples/cct_inference.rs"
required-features = ["target-checks"]
test = false

[[example]]
name = "cvt_inference"
