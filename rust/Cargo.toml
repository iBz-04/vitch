path = "examples/pit_inference.rs"
required-features = ["target-checks"]
test = false

[[example]]
name = "levit_inference"
path = "examples/levit_inference.rs"
required-features = ["target-checks"]
test = false

[[example]]
name = "vit_1d"
path = "examples/vit_1d.rs"
required-features = ["target-checks"]
test = false

[[example]]
